<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="business-card">
        <img class="profile-image"src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="profile image">
        <p class="full-name">full name</p>
        <p class="designation">Software Developer</p>
        <p class="company">free code camp</p>
        <hr>
        <p>Email: your-email@example.com</p>
        <p>Phone: (123) 456-7890</p>
        <a class="portfolio-link" href="https://www.freecodecamp.org/">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://www.freecodecamp.org/">Twitter</a>
            <a href="https://www.freecodecamp.org/">LinkedIn</a>
            <a href="https://www.freecodecamp.org/">GitHub</a>
        </div>
    </div>
</body>
</html>
